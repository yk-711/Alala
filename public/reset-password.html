<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تعيين كلمة مرور جديدة | متجر سطول</title>
  <link rel="stylesheet" href="login.css">
</head>
<body class="reset-page">
  <div class="background-orb orb-1"></div>
  <div class="background-orb orb-2"></div>
  <main class="auth-card reset-card">
    <section class="brand reset-brand">
      <div class="logo">✦</div>
      <span class="small-title">SOTOOL STORE / PRIVATE ACCESS</span>
      <h1>نعود بك<br><strong>إلى مساحتك الخاصة</strong></h1>
      <div class="gold-line"></div>
      <p>اختر كلمة مرور جديدة، ودع تجربتك تستمر بأمان وأناقة.</p>
    </section>
    <section class="form-area">
      <div class="form-box">
        <div class="security-mark" aria-hidden="true">✦</div>
        <h2>تعيين كلمة مرور جديدة</h2>
        <p class="hint">يجب أن تتكون كلمة المرور من 8 أحرف على الأقل</p>
        <form id="resetForm">
          <div class="field">
            <label for="newPassword">كلمة المرور الجديدة</label>
            <div class="password-box">
              <input id="newPassword" type="password" autocomplete="new-password" minlength="8" required placeholder="8 أحرف على الأقل">
              <button type="button" class="eye" data-password="newPassword">إظهار</button>
            </div>
          </div>
          <div class="field">
            <label for="confirmNewPassword">تأكيد كلمة المرور</label>
            <input id="confirmNewPassword" type="password" autocomplete="new-password" required placeholder="أعد كتابة كلمة المرور">
          </div>
          <button class="main-btn" type="submit">حفظ كلمة المرور</button>
        </form>
        <p id="resetMessage" class="message" role="status" aria-live="polite"></p>
        <a class="back-store" href="login.html">العودة إلى تسجيل الدخول</a>
      </div>
    </section>
  </main>
  <script src="reset-password.js"></script>
</body>
</html>
