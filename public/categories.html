<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>أقسام عبايات نسمة</title><link rel="stylesheet" href="shop.css"></head><body class="shop-page"><nav class="shop-nav"><div class="shop-wrap shop-nav-inner"><a href="./">الرئيسية</a><a href="products-page.html">العبايات</a><a class="active" href="categories.html">الأقسام</a><a href="wishlist.html">الأمنيات</a><a href="cart.html">السلة</a><label class="shop-currency">العملة <select id="shopCurrency"><option value="yer">ر.ي</option><option value="sar">ر.س</option><option value="usd">$</option></select></label></div></nav><header class="shop-head shop-wrap"><span class="shop-kicker">NESMA CATEGORIES</span><h1>أقسام العبايات</h1><p>اختاري القسم للوصول مباشرة إلى تشكيلته.</p></header><main class="shop-wrap"><div id="categoryGrid" class="category-grid-shop"></div></main><script src="shared.js"></script><script src="shop.js"></script><script src="notifications.js"></script><script>document.addEventListener("nesma:data-ready",e=>{const el=document.getElementById("categoryGrid");el.innerHTML=e.detail.categories.map(c=>`<a class="category-tile" href="products-page.html?category=${encodeURIComponent(c.slug)}">${c.image_url?`<img src="${window.Nesma.imageUrl(c.image_url)}" alt="">`:""}<div><h2>${c.name}</h2><span>استكشفي القسم ←</span></div></a>`).join("")||'<div class="empty">لا توجد أقسام حالياً.</div>';});</script></body></html>
