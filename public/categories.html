<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>أقسام متجر سطول</title><link rel="stylesheet" href="shop.css"></head><body class="shop-page"><nav class="shop-nav"><div class="shop-wrap shop-nav-inner"><a href="./">الرئيسية</a><a href="products-page.html">المنتجات</a><a class="active" href="categories.html">الأقسام</a><a href="wishlist.html">الأمنيات</a><a href="cart.html">السلة</a></div></nav><header class="shop-head shop-wrap"><span class="shop-kicker">SHOP BY CATEGORY</span><h1>الأقسام</h1><p>اختاري القسم للوصول مباشرة إلى المنتجات.</p></header><main class="shop-wrap"><div id="categoryGrid" class="category-grid-shop"></div></main><script src="shop.js"></script><script>document.addEventListener('sotool:data-ready',e=>{const s=e.detail,el=document.getElementById('categoryGrid');el.innerHTML=s.categories.map(c=>`<a class="category-tile" href="products-page.html?category=${encodeURIComponent(c.slug)}">${c.image_url?`<img src="${c.image_url}" alt="">`:''}<div><h2>${c.name}</h2><span>استكشفي القسم ←</span></div></a>`).join('')||'<div class="empty">لا توجد أقسام حالياً.</div>'});</script></body></html>
