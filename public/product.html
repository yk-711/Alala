<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>منتج | سطول</title><link rel="stylesheet" href="shop.css"></head><body class="shop-page"><nav class="shop-nav"><div class="shop-wrap shop-nav-inner"><a href="/">الرئيسية</a><a href="/products-page.html">المنتجات</a><a href="/categories.html">الأقسام</a><a href="/wishlist.html">الأمنيات</a><a href="/cart.html">السلة</a></div></nav><main class="shop-wrap" id="detail"></main><script src="shop.js"></script><script>document.addEventListener('sotool:data-ready',e=>{const p=e.detail.products.find(x=>String(x.id)===new URLSearchParams(location.search).get('id')),el=document.getElementById('detail');if(!p){el.innerHTML='<div class="empty">المنتج غير موجود.</div>';return}el.innerHTML=`<div style="display:grid;grid-template-columns:1fr 1fr;gap:25px;padding:35px 0"><div class="shop-img" style="border-radius:0 35px 35px 35px;aspect-ratio:.9"><img src="${p.image_url}" alt="${p.title}"></div><div style="background:#fff;border:1px solid #eadfca;border-radius:0 30px 30px 30px;padding:25px"><div class="shop-cat">${p.category}</div><h1>${p.title}</h1><p style="color:#777;line-height:1.9">${p.description||''}</p><div class="shop-price"><strong>${Number(p.price).toFixed(2)} ${p.currency||'ر.س'}</strong>${p.old_price?`<span class="shop-old">${Number(p.old_price).toFixed(2)} ر.س</span>`:''}</div><button class="shop-add" style="width:100%" id="add">أضف إلى السلة</button></div></div>`;document.getElementById('add').onclick=()=>{const x=e.detail.state.cart.find(i=>String(i.id)===String(p.id));if(x)x.qty++;else e.detail.state.cart.push({id:p.id,title:p.title,price:Number(p.price),image:p.image_url,qty:1});localStorage.setItem('sotool-cart',JSON.stringify(e.detail.state.cart));location.href='/cart.html'};});</script></body></html>
