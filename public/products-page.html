<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>عبايات نسمة</title><link rel="stylesheet" href="shop.css"></head><body class="shop-page">
<nav class="shop-nav"><div class="shop-wrap shop-nav-inner"><a href="./">الرئيسية</a><a class="active" href="products-page.html">العبايات</a><a href="categories.html">الأقسام</a><a href="wishlist.html">الأمنيات</a><a href="cart.html">السلة</a><label class="shop-currency">العملة <select id="shopCurrency"><option value="yer">ر.ي</option><option value="sar">ر.س</option><option value="usd">$</option></select></label></div></nav>
<header class="shop-head shop-wrap"><span class="shop-kicker">NESMA ABAYA COLLECTION</span><h1>تشكيلة العبايات</h1><p>اختاري القسم ثم اكتشفي التفاصيل والمقاسات والألوان والخامات المتاحة.</p></header>
<main class="shop-wrap"><div id="categoryTabs" class="shop-nav-inner" style="background:transparent;padding:0 0 10px"></div><section id="productsGrid" class="shop-grid"></section></main>
<script src="shared.js"></script><script src="shop.js"></script><script src="notifications.js"></script>
<script>document.addEventListener("nesma:data-ready",e=>{const s=e.detail,c=document.getElementById("categoryTabs");c.innerHTML='<a href="#" class="active" data-cat="all">الكل</a>'+s.categories.map(x=>`<a href="#" data-cat="${x.slug}">${x.name}</a>`).join("");const wanted=new URLSearchParams(location.search).get("category")||"all";const initial=c.querySelector(`[data-cat="${wanted}"]`)||c.querySelector('[data-cat="all"]');const render=cat=>window.NesmaShop.renderGrid("productsGrid",cat==="all"?s.products:s.products.filter(p=>(p.category_slugs||[]).includes(cat)));c.querySelectorAll("a").forEach(a=>a.classList.remove("active"));initial.classList.add("active");render(initial.dataset.cat);c.querySelectorAll("[data-cat]").forEach(a=>a.onclick=x=>{x.preventDefault();c.querySelectorAll("a").forEach(z=>z.classList.remove("active"));a.classList.add("active");render(a.dataset.cat)})});</script></body></html>
