<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>منتجات سطول</title><link rel="stylesheet" href="shop.css"></head><body class="shop-page"><nav class="shop-nav"><div class="shop-wrap shop-nav-inner"><a href="/">الرئيسية</a><a class="active" href="/products-page.html">المنتجات</a><a href="/categories.html">الأقسام</a><a href="/wishlist.html">الأمنيات</a><a href="/cart.html">السلة</a></div></nav><header class="shop-head shop-wrap"><span class="shop-kicker">SOTOOL COLLECTION</span><h1>منتجات سطول</h1><p>اختاري القسم واستكشفي المنتجات المتاحة.</p></header><main class="shop-wrap"><div id="categoryTabs" class="shop-nav-inner" style="background:transparent;padding:0 0 10px"></div><section id="productsGrid" class="shop-grid"></section></main><script src="shop.js"></script><script>document.addEventListener('sotool:data-ready',e=>{const s=e.detail,c=document.getElementById('categoryTabs');c.innerHTML='<a href="#" class="active" data-cat="all">الكل</a>'+s.categories.map(x=>`<a href="#" data-cat="${x.slug}">${x.name}</a>`).join('');const render=cat=>SutoolShop.renderGrid('productsGrid',cat==='all'?s.products:s.products.filter(p=>(p.category_slugs||[]).includes(cat)));const wanted=new URLSearchParams(location.search).get('category')||'all';const initial=c.querySelector(`[data-cat="${wanted}"]`)||c.querySelector('[data-cat="all"]');c.querySelectorAll('a').forEach(z=>z.classList.remove('active'));initial.classList.add('active');render(initial.dataset.cat);c.querySelectorAll('[data-cat]').forEach(a=>a.onclick=x=>{x.preventDefault();c.querySelectorAll('a').forEach(z=>z.classList.remove('active'));a.classList.add('active');render(a.dataset.cat)})});</script></body></html>
