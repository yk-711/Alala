<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إتمام الطلب | نسمة</title><link rel="stylesheet" href="shop.css"><style>body{background:#050505;color:#fff;font-family:Tajawal,Arial,sans-serif}.checkout-page{padding:35px 0 60px}.checkout-grid{display:grid;grid-template-columns:1fr .75fr;gap:18px}.box{background:#0d0d0d;border:1px solid #30291d;border-radius:0 28px 28px 28px;padding:22px}.box h1{margin-top:0;color:#d5b56e}.form{display:grid;gap:12px}.form input,.form textarea{width:100%;box-sizing:border-box;background:#111;color:#fff;border:1px solid #423823;border-radius:12px;padding:12px;font:inherit}.submit{border:0;background:#d5b56e;color:#111;border-radius:13px;padding:14px;font:inherit;font-weight:800;cursor:pointer}.line{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid #29251d}.line img{width:60px;height:72px;object-fit:cover;border-radius:10px}.line small{display:block;color:#999;margin-top:4px}.total{display:flex;justify-content:space-between;font-size:20px;font-weight:800;margin-top:15px}.gold{color:#d5b56e}.empty{text-align:center;color:#999;padding:40px}@media(max-width:800px){.checkout-grid{grid-template-columns:1fr}}</style></head><body><main class="shop-wrap checkout-page"><div class="checkout-grid"><section class="box"><span class="shop-kicker">NESMA CHECKOUT</span><h1>إتمام الطلب</h1><form class="form" id="form"><input id="name" required placeholder="الاسم الكامل"><input id="phone" required type="tel" placeholder="رقم الهاتف"><input id="city" required placeholder="المدينة"><input id="address" required placeholder="العنوان"><textarea id="notes" rows="4" placeholder="ملاحظات إضافية"></textarea><button class="submit" type="submit">حفظ الطلب وفتح واتساب</button><div id="status" style="color:#d5b56e"></div></form></section><aside class="box"><h2>ملخص السلة</h2><div id="items"></div><div class="total"><span>الإجمالي</span><strong class="gold" id="total">0 ر.ي</strong></div></aside></div></main><script src="shop.js"></script><script src="notifications.js"></script><script>(async()=>{const cart=JSON.parse(localStorage.getItem('nesma-cart')||'[]');const items=document.getElementById('items'),totalEl=document.getElementById('total'),status=document.getElementById('status');let sum=0;if(!cart.length){items.innerHTML='<div class="empty">السلة فارغة. <a href="products-page.html" style="color:#d5b56e">اختاري منتجاً</a></div>';}else{items.innerHTML=cart.map(x=>{const price=Number(x.price_yer??x.price??0);sum+=price*Number(x.qty||1);return `<div class="line"><img src="${x.image||''}" alt=""><div><strong>${x.title||''}</strong><small>المقاس: ${x.size||'—'} · اللون: ${x.color||'—'} · القماش: ${x.fabric||'—'} · الكمية: ${x.qty}</small><small>${NesmaShop.money(price)}</small></div></div>`}).join('');totalEl.textContent=NesmaShop.money(sum)}const renderCheckoutCurrency=()=>{let s=0;items.innerHTML=cart.length?cart.map(x=>{const price=Number(x.price_yer??x.price??0);s+=price*Number(x.qty||1);return `<div class="line"><img src="${x.image||''}" alt=""><div><strong>${x.title||''}</strong><small>المقاس: ${x.size||'—'} · اللون: ${x.color||'—'} · القماش: ${x.fabric||'—'} · الكمية: ${x.qty}</small><small>${NesmaShop.money(price)}</small></div></div>`}).join(''):'<div class="empty">السلة فارغة. <a href="products-page.html" style="color:#d5b56e">اختاري منتجاً</a></div>';totalEl.textContent=NesmaShop.money(s);sum=s;};
document.addEventListener('nesma:currency',renderCheckoutCurrency);
const form=document.getElementById('form'),nameEl=document.getElementById('name'),phoneEl=document.getElementById('phone'),cityEl=document.getElementById('city'),addressEl=document.getElementById('address'),notesEl=document.getElementById('notes');form.onsubmit=async e=>{e.preventDefault();if(!cart.length)return;status.textContent='جاري حفظ الطلب…';try{const r=await fetch('https://nesma-store.onrender.com/api/orders',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:nameEl.value.trim(),phone:phoneEl.value.trim(),city:cityEl.value.trim(),address:addressEl.value.trim(),notes:notesEl.value.trim(),referral_code:localStorage.getItem('nesma-referral-code')||'',items:cart.map(x=>({id:x.id,name:x.title,image_url:x.image,price_yer:Number(x.price_yer??x.price??0),quantity:Number(x.qty||1),size:x.size||'',color:x.color||'',fabric:x.fabric||''}))})});const d=await r.json();if(!r.ok)throw new Error(d.message||'تعذر حفظ الطلب');const lines=cart.map(x=>`• ${x.title} — المقاس ${x.size||'—'} — اللون ${x.color||'—'} — القماش ${x.fabric||'—'} — ${x.qty} × ${Number(x.price_yer??x.price??0).toLocaleString('en-US')} ر.ي`);const msg=`مرحباً متجر نسمة، أريد تأكيد الطلب رقم ${d.order.id}\nالاسم: ${nameEl.value.trim()}\nالهاتف: ${phoneEl.value.trim()}\nالمدينة: ${cityEl.value.trim()}\nالعنوان: ${addressEl.value.trim()}\n\nالمنتجات:\n${lines.join('\n')}\n\nالإجمالي: ${sum.toLocaleString('en-US')} ر.ي\nملاحظات: ${notesEl.value.trim()||'لا توجد'}`;localStorage.removeItem('nesma-cart');window.open('https://wa.me/967700082002?text='+encodeURIComponent(msg),'_blank','noopener,noreferrer');status.textContent='تم حفظ الطلب.';}catch(err){status.textContent=err.message;}}})();</script></body></html>
