<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إتمام الطلب | نسمة</title><link rel="stylesheet" href="shop.css"><style>body{background:#050505;color:#fff;font-family:Tajawal,Arial,sans-serif}.checkout-page{padding:35px 0 60px}.checkout-grid{display:grid;grid-template-columns:1fr .75fr;gap:18px}.box{background:#0d0d0d;border:1px solid #30291d;border-radius:0 28px 28px 28px;padding:22px}.box h1{margin-top:0;color:#d5b56e}.form{display:grid;gap:12px}.form input,.form textarea{width:100%;box-sizing:border-box;background:#111;color:#fff;border:1px solid #423823;border-radius:12px;padding:12px;font:inherit}.submit{border:0;background:#d5b56e;color:#111;border-radius:13px;padding:14px;font:inherit;font-weight:800;cursor:pointer}.line{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid #29251d}.line img{width:60px;height:72px;object-fit:cover;border-radius:10px}.line small{display:block;color:#999;margin-top:4px}.total{display:flex;justify-content:space-between;font-size:20px;font-weight:800;margin-top:15px}.gold{color:#d5b56e}.empty{text-align:center;color:#999;padding:40px}@media(max-width:800px){.checkout-grid{grid-template-columns:1fr}}</style></head><body><nav class="shop-nav"><div class="shop-wrap shop-nav-inner"><a href="./">الرئيسية</a><a href="products-page.html">المنتجات</a><a href="cart.html">السلة</a></div></nav><main class="shop-wrap checkout-page"><div class="checkout-grid"><section class="box"><span class="shop-kicker">NESMA CHECKOUT</span><h1>إتمام الطلب</h1><form class="form" id="form"><input id="name" required placeholder="الاسم الكامل"><input id="phone" required type="tel" placeholder="رقم الهاتف"><input id="address" required placeholder="العنوان والمدينة"><textarea id="notes" rows="4" placeholder="ملاحظات إضافية"></textarea><button class="submit" type="submit">إرسال الطلب عبر واتساب</button></form></section><aside class="box"><h2>ملخص السلة</h2><div id="items"></div><div class="total"><span>الإجمالي</span><strong class="gold" id="total">0 ر.ي</strong></div></aside></div></main><script>const cart=JSON.parse(localStorage.getItem('nesma-cart')||'[]');const items=document.getElementById('items');const total=document.getElementById('total');let sum=0;if(!cart.length)items.innerHTML='<div class="empty">السلة فارغة. <a href="products-page.html" style="color:#d5b56e">اختاري منتجاً</a></div>';else{items.innerHTML=cart.map(x=>{sum+=Number(x.price)*Number(x.qty);return `<div class="line"><img src="${x.image||''}" alt=""><div><strong>${x.title}</strong><small>المقاس: ${x.size||'—'} · اللون: ${x.color||'—'} · القماش: ${x.fabric||'—'} · الكمية: ${x.qty}</small></div></div>`}).join('');total.textContent=sum.toLocaleString('en-US')+' ر.ي'}document.getElementById('form').onsubmit=e=>{e.preventDefault();if(!cart.length)return;const lines=cart.map(x=>`• ${x.title} — المقاس ${x.size||'—'} — اللون ${x.color||'—'} — القماش ${x.fabric||'—'} — ${x.qty} × ${Number(x.price).toLocaleString('en-US')} ر.ي`);const msg=`مرحباً متجر نسمة، أريد تأكيد الطلب:\nالاسم: ${name.value.trim()}\nالهاتف: ${phone.value.trim()}\nالعنوان: ${address.value.trim()}\n\nالمنتجات:\n${lines.join('\n')}\n\nالإجمالي: ${sum.toLocaleString('en-US')} ر.ي\nملاحظات: ${notes.value.trim()||'لا توجد'}`;window.open('https://wa.me/967781797884?text='+encodeURIComponent(msg),'_blank','noopener,noreferrer')};</script></body></html>
