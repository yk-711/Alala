services:
  - type: web
    name: accounting-system
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: TZ
        value: Asia/Aden
      - key: PORT
        value: "10000"
