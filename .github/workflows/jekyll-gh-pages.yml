name: Deploy Sotool Store to GitHub Pages

on:
  push:
    branches: ["main"] # عدلها إلى master إذا كان فرعك الرئيسي هو master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Pages
        uses: actions/configure-pages@v4
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # هذا السطر يوجه جيت هوب لأخذ الملفات من مجلد public مباشرة
          path: './public'
      
      - name: Deploy to GitHub
        id: deployment
        uses: actions/deploy-pages@v4
